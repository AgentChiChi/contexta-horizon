name: Publish verified 0.5.1 preview
on:
  push:
    tags: ['v0.5.1']
permissions: {}
jobs:
  publish:
    if: github.repository == 'AgentChiChi/contexta-horizon'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify and publish the reviewed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release/v0.5.1
          cp ../../Examples/sample-mail.mbox .
          sha256sum --check SHA256SUMS.txt

          gh release create v0.5.1 --repo AgentChiChi/contexta-horizon --verify-tag --prerelease \
            --title 'Contexta Horizon 0.5.1: Where did we leave this?' \
            --notes-file ../../docs/releases/v0.5.1.md \
            Contexta-Horizon-0.5.1-macOS-arm64.zip Horizon-Aside-skill.zip sample-mail.mbox SHA256SUMS.txt
